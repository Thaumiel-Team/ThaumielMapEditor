name: ThaumielMapEditor Auto Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

env:
  GAME_INSTALL_PATH: ${{ github.workspace }}/scpsl_server
  SL_REFERENCES: "${{ github.workspace }}/scpsl_server/SCPSL_Data/Managed"
  STEAM_APP_ID: "996560" # ID for Dedicated Server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Download build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ThaumielMapEditor/deps
          gh run download 34764608836 -R KadavasKingdom/LabApiExtensions -n Project -D ThaumielMapEditor/deps
          ls -la ThaumielMapEditor/deps
          
      - name: Install SteamCMD
        run: |
          sudo add-apt-repository -y multiverse
          sudo dpkg --add-architecture i386
          sudo apt-get update
          echo "steam steam/question select I AGREE" | sudo debconf-set-selections
          echo "steam steam/license note" | sudo debconf-set-selections
          sudo apt-get install -y steamcmd
          sudo ln -sf /usr/games/steamcmd /usr/bin/steamcmd
          steamcmd +quit

      - name: Download SL
        run: |
          mkdir -p "${{ env.GAME_INSTALL_PATH }}"
          steamcmd +login anonymous +quit
          steamcmd +force_install_dir "${{ env.GAME_INSTALL_PATH }}" \
                   +login anonymous \
                   +app_update ${{ env.STEAM_APP_ID }} validate \
                   +quit

      - name: Build
        run: dotnet build ThaumielMapEditor/ThaumielMapEditor.csproj --configuration Release --output build "-p:SL_REFERENCES=${{ env.SL_REFERENCES }}"

      - name: Build ToolGun
        run: dotnet build ThaumielMapEditor.ToolGun/ThaumielMapEditor.ToolGun.csproj --configuration Release --output build-toolgun "-p:SL_REFERENCES=${{ env.SL_REFERENCES }}"

      - name: Package ToolGun dependencies
        run: |
          mkdir -p toolgun-deps/plugins/global toolgun-deps/dependencies/global

          SECRET_VERSION=$(grep 'PackageReference Include="SecretAPI"' ThaumielMapEditor.ToolGun/ThaumielMapEditor.ToolGun.csproj | sed -n 's/.*Version="\([^"]*\)".*/\1/p')
          echo "SecretAPI version: $SECRET_VERSION"
          curl -fsSL "https://www.nuget.org/api/v2/package/SecretAPI/${SECRET_VERSION}" -o SecretAPI.nupkg
          unzip -j -o SecretAPI.nupkg "lib/net48/SecretAPI.dll" -d toolgun-deps/plugins/global/
          rm SecretAPI.nupkg

          cp ThaumielMapEditor.ToolGun/Dependencies/CustomItemsAPI.dll toolgun-deps/plugins/global/CustomItemsAPI.dll

          LAE=$(find ThaumielMapEditor/deps -name LabApiExtensions.dll | head -n 1)
          test -n "$LAE" || { echo "LabApiExtensions.dll not found"; exit 1; }
          cp "$LAE" toolgun-deps/dependencies/global/LabApiExtensions.dll

          (cd toolgun-deps && zip -r ../Toolgun-Dependencies.zip plugins dependencies)
          unzip -l Toolgun-Dependencies.zip
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThaumielMapEditor
          path: |
            build/
            build-toolgun/ThaumielMapEditor.ToolGun.dll

      - name: Upload ToolGun dependencies artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toolgun-Dependencies
          path: Toolgun-Dependencies.zip

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep "public override Version Version" ThaumielMapEditor/Main.cs | sed -n 's/.*new(\([^)]*\)).*/\1/p' | sed 's/ //g' | sed 's/,/./g')
          echo "Detected version: $VERSION"
          echo "plugin_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create draft release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.get_version.outputs.plugin_version }}
          name: "Build #${{ github.run_number }} — ${{ github.sha }}"
          body: |
            > [!NOTE]
            > The Assemblies in Toolgun-Dependencies.zip are both plugins and dependencies. You should be able to directly copy them into the SLSERVER/LabApi/... directory.
            
            Automated release for version ${{ steps.get_version.outputs.plugin_version }}.
          files: |
            build/ThaumielMapEditor.dll
            build-toolgun/ThaumielMapEditor.ToolGun.dll
            Toolgun-Dependencies.zip
          skip-if-release-exists: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
