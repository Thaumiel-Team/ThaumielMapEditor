name: Generate GitBook Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:
  
jobs:
  docs:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate GitBook docs
        run: |
          python3 GitbookDocGen.py ThaumielMapEditor \
            --output gitbook_out \
            --friendly-titles

      - name: Checkout Docs repo
        uses: actions/checkout@v4.2.2
        with:
          repository: Thaumiel-Team/Docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo

      - name: Sync generated docs into dev-docs/devdocs
        run: |
          mkdir -p docs-repo/dev-docs/devdocs
          rsync -av --delete gitbook_out/ docs-repo/dev-docs/devdocs/

      - name: Commit and push to Docs repo
        working-directory: docs-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev-docs/devdocs
          if git diff --cached --quiet; then
            echo "No doc changes to commit."
          else
            git commit -m "docs: auto-update devdocs from ThaumielMapEditor@${{ github.sha }}"
            git push origin main
          fi